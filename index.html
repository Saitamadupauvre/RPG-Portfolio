<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="./src/style.css">
  <link rel="stylesheet" href="./src/style/pixel-ui.css">
  <link rel="stylesheet" href="./src/style/book.css">
  <link rel="stylesheet" href="./src/style/hud.css">
  <link rel="stylesheet" href="./src/style/screens.css">
</head>
<body>
  <canvas class="webgl"></canvas>
  <div id="ui-container" class="state-loading pixel-ui">
    <div class="screen" id="menu-screen">
      <div class="menu-column">
        <p class="menu-kicker" data-i18n="menu.kicker">A playable portfolio</p>
        <h1 class="title"><span>Soldier's</span> <span>Portfolio</span></h1>
        <p class="menu-tagline" data-i18n="menu.tagline">A small open world to roam. Every glowing statue holds one of my projects.</p>
        <nav class="menu-actions" aria-label="Choose how to browse" data-i18n-aria-label="menu.nav">
          <button class="btn menu-btn menu-btn-play" id="btn-enter-game">
            <span class="menu-btn-text">
              <span class="menu-btn-label" data-i18n="menu.play">Play the game</span>
              <span class="menu-btn-hint" data-i18n="menu.play.hint">Explore, fight, discover the projects</span>
            </span>
            <span class="menu-btn-arrow" data-arrow></span>
          </button>
          <div class="menu-fast">
            <button class="btn menu-btn menu-btn-fast" id="btn-enter-classic">
              <span class="menu-btn-text">
                <span class="menu-btn-label" data-i18n="menu.fast">Fast portfolio</span>
                <span class="menu-btn-hint" data-i18n="menu.fast.hint">Every project in one list, no game</span>
              </span>
              <span class="menu-btn-arrow" data-arrow></span>
            </button>
            <p class="menu-callout">
              <span class="menu-callout-arrow" id="menu-callout-arrow"></span>
              <span class="menu-callout-text"><span data-i18n="menu.callout">Recruiter in a hurry?</span><br><strong data-i18n="menu.callout.cta">Start here</strong></span>
            </p>
          </div>
        </nav>
      </div>
      <p class="menu-footer" data-i18n="menu.footer">Keyboard &amp; mouse &middot; best on desktop</p>
      <div class="menu-lang" id="menu-lang" role="group" aria-label="Language" data-i18n-aria-label="menu.language"></div>
    </div>
    <div id="low-hp-vignette"></div>
    <div id="hud">
      <div class="hud-health" id="hud-health">
        <span class="hud-heart" id="hud-heart"></span>
        <div class="hud-bar" id="hp-bar">
          <div class="hud-bar-trail" id="hp-trail"></div>
          <div class="hud-bar-fill" id="hp-fill"></div>
          <div class="hud-bar-ticks"></div>
          <span class="hud-bar-label" id="hp-label">100 / 100</span>
        </div>
      </div>
      <div class="hud-coins" id="hud-coins">
        <span class="hud-coin" id="hud-coin"></span>
        <span class="hud-coin-count" id="coin-count">0</span>
      </div>
      <div class="hud-toast" id="loot-toast"></div>
    </div>
    <div id="interact-prompt"></div>
    <div class="book-overlay" id="book">
      <div class="book-backdrop"></div>
      <div class="book" id="book-body">
        <div class="book-cover"></div>
        <nav class="book-tabs" id="book-tabs"></nav>
        <div class="book-stack book-stack-left"></div>
        <div class="book-stack book-stack-right"></div>
        <section class="book-page book-page-left" id="book-page-left">
          <div id="book-toc"></div>
        </section>
        <section class="book-page book-page-right" id="book-page-right">
          <div id="book-entry"></div>
        </section>
        <div class="book-flipper" id="book-flipper"></div>
        <button class="book-turn book-turn-prev" id="btn-book-prev" aria-label="Previous page" data-i18n-aria-label="book.prev"></button>
        <button class="book-turn book-turn-next" id="btn-book-next" aria-label="Next page" data-i18n-aria-label="book.next"></button>
        <div class="book-front-cover"><span data-i18n="book.cover">Portfolio</span></div>
        <button class="book-close" id="btn-close-book" aria-label="Close book" data-i18n-aria-label="book.close"></button>
      </div>
    </div>
  </div>
  <div id="iris"></div>
  <div class="screen pixel-ui" id="loading-screen">
    <div class="loading-embers" id="loading-embers"></div>
    <div class="loading-center">
      <h1 class="loading-title">SOLDIER'S PORTFOLIO</h1>
      <p class="loading-tip" id="loading-tip"></p>
    </div>
    <div class="loading-corner" role="status" aria-label="Loading" data-i18n-aria-label="loading.label">
      <span class="loading-fire" id="loading-fire"></span>
      <div class="loading-meter">
        <div class="loading-label">
          <span><span data-i18n="loading.label">Loading</span><span class="loading-dots"></span></span>
          <span id="loading-percent">0%</span>
        </div>
        <div class="loading-bar"><div id="progress-fill"></div></div>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
