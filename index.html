<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="./src/style.css">
  <link rel="stylesheet" href="./src/style/pixel-ui.css">
  <link rel="stylesheet" href="./src/style/book.css">
</head>
<body>
  <canvas class="webgl"></canvas>
  <div id="ui-container" class="state-loading pixel-ui">
    <div class="screen" id="loading-screen">
      <h1>Loading Universe...</h1>
      <div class="progress-bar">
        <div id="progress-fill"></div>
      </div>
    </div>
    <div class="screen" id="menu-screen">
      <h1 class="title">SOLDIER'S PORTFOLIO</h1>
      <div class="menu-actions">
        <button class="btn" id="btn-enter-game">Game Mode</button>
        <button class="btn" id="btn-enter-classic">Fast Portfolio</button>
      </div>
    </div>
    <div id="hud">
      <div id="hp-bar" class="pixel-panel">
        <div id="hp-fill"></div>
      </div>
      <span id="hp-label" class="pixel-text">100 / 100</span>
      <span id="coin-count" class="pixel-text">0 coins</span>
    </div>
    <div id="loot-toast" class="pixel-panel pixel-text"></div>
    <div id="interact-prompt" class="pixel-panel"></div>
    <div class="book-overlay" id="book">
      <div class="book-backdrop"></div>
      <div class="book" id="book-body">
        <div class="book-cover"></div>
        <nav class="book-tabs" id="book-tabs"></nav>
        <div class="book-stack book-stack-left"></div>
        <div class="book-stack book-stack-right"></div>
        <section class="book-page book-page-left" id="book-page-left">
          <div id="book-toc"></div>
        </section>
        <section class="book-page book-page-right" id="book-page-right">
          <button class="book-back" id="btn-book-back">&larr; Contents</button>
          <div id="book-entry"></div>
        </section>
        <div class="book-flipper" id="book-flipper"></div>
        <div class="book-front-cover"><span>Portfolio</span></div>
        <button class="book-close" id="btn-close-book" aria-label="Close book"></button>
      </div>
    </div>
    <div class="modal" id="upgrade-board">
      <div class="modal-content pixel-panel upgrade-content">
        <button id="btn-close-upgrade" class="close-btn">×</button>
        <h2 class="title">Level Up</h2>
        <p id="upgrade-coins" class="pixel-text">0 coins</p>
        <div id="upgrade-list"></div>
      </div>
    </div>
    <div class="modal" id="project-modal">
      <div class="modal-content pixel-panel">
        <button id="btn-close-modal" class="close-btn">×</button>
        <div id="project-modal-body"></div>
      </div>
    </div>
  </div>
  <div id="iris"></div>
  <div id="death-text" class="pixel-text">YOU DIED</div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
