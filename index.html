<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="./src/style.css">
  <link rel="stylesheet" href="./src/style/pixel-ui.css">
  <link rel="stylesheet" href="./src/style/book.css">
  <link rel="stylesheet" href="./src/style/hud.css">
  <link rel="stylesheet" href="./src/style/screens.css">
</head>
<body>
  <canvas class="webgl"></canvas>
  <div id="ui-container" class="state-loading pixel-ui">
    <div class="screen" id="menu-screen">
      <h1 class="title">SOLDIER'S PORTFOLIO</h1>
      <div class="menu-actions">
        <button class="btn" id="btn-enter-game">Game Mode</button>
        <button class="btn" id="btn-enter-classic">Fast Portfolio</button>
      </div>
    </div>
    <div id="low-hp-vignette"></div>
    <div id="hud">
      <div class="hud-health" id="hud-health">
        <span class="hud-heart" id="hud-heart"></span>
        <div class="hud-bar" id="hp-bar">
          <div class="hud-bar-trail" id="hp-trail"></div>
          <div class="hud-bar-fill" id="hp-fill"></div>
          <div class="hud-bar-ticks"></div>
          <span class="hud-bar-label" id="hp-label">100 / 100</span>
        </div>
      </div>
      <div class="hud-coins" id="hud-coins">
        <span class="hud-coin" id="hud-coin"></span>
        <span class="hud-coin-count" id="coin-count">0</span>
      </div>
      <div class="hud-toast" id="loot-toast"></div>
    </div>
    <div id="interact-prompt"></div>
    <div class="book-overlay" id="book">
      <div class="book-backdrop"></div>
      <div class="book" id="book-body">
        <div class="book-cover"></div>
        <nav class="book-tabs" id="book-tabs"></nav>
        <div class="book-stack book-stack-left"></div>
        <div class="book-stack book-stack-right"></div>
        <section class="book-page book-page-left" id="book-page-left">
          <div id="book-toc"></div>
        </section>
        <section class="book-page book-page-right" id="book-page-right">
          <button class="book-back" id="btn-book-back">&larr; Contents</button>
          <div id="book-entry"></div>
        </section>
        <div class="book-flipper" id="book-flipper"></div>
        <div class="book-front-cover"><span>Portfolio</span></div>
        <button class="book-close" id="btn-close-book" aria-label="Close book"></button>
      </div>
    </div>
  </div>
  <div id="death-screen" class="pixel-ui">
    <div class="death-band">
      <h2 class="death-title">YOU DIED</h2>
      <p class="death-loss" id="death-loss"></p>
    </div>
  </div>
  <div id="death-flash"></div>
  <div id="iris"></div>
  <div class="screen pixel-ui" id="loading-screen">
    <div class="loading-embers" id="loading-embers"></div>
    <div class="loading-center">
      <h1 class="loading-title">SOLDIER'S PORTFOLIO</h1>
      <p class="loading-tip" id="loading-tip"></p>
    </div>
    <div class="loading-corner" role="status" aria-label="Loading">
      <span class="loading-fire" id="loading-fire"></span>
      <div class="loading-meter">
        <div class="loading-label">
          <span>Loading<span class="loading-dots"></span></span>
          <span id="loading-percent">0%</span>
        </div>
        <div class="loading-bar"><div id="progress-fill"></div></div>
      </div>
    </div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
